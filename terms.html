<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المصطلحات</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}

body{
background:#f4f6f8;
color:#111827;
line-height:2;
}

body.dark{
background:#0f172a;
color:white;
}

header{
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
padding:70px 20px;
text-align:center;
border-bottom:4px solid #c9a227;
}

header h1{
font-size:48px;
}

header p{
font-size:20px;
margin-top:10px;
}

nav{
background:white;
padding:18px;
text-align:center;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

nav a{
text-decoration:none;
color:#111827;
margin:0 20px;
font-weight:bold;
}

body.dark nav{
background:#1e293b;
}

body.dark nav a{
color:white;
}

.toolbar{
position:fixed;
top:20px;
left:20px;
display:flex;
gap:10px;
z-index:999;
}

.toolbar button{
padding:10px 14px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
background:white;
color:#111827;
}

.container{
width:90%;
max-width:1200px;
margin:40px auto;
}

.search-box{
display:flex;
gap:10px;
margin-bottom:30px;
}

.search-box input{
flex:1;
padding:15px;
border:1px solid #d1d5db;
border-radius:12px;
font-size:16px;
}

.search-box button{
padding:15px 25px;
border:none;
background:#0f766e;
color:white;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

.terms-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(310px,1fr));
gap:22px;
}

.term-card{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.07);
border:1px solid #e5e7eb;
position:relative;
overflow:hidden;
}

.term-card::before{
content:"";
position:absolute;
top:0;
right:0;
width:100%;
height:5px;
background:linear-gradient(90deg,#c9a227,#0f766e);
}

body.dark .term-card{
background:#1e293b;
border-color:#334155;
}

.term-card h2{
color:#0f766e;
margin-bottom:5px;
}

.term-card h3{
color:#c9a227;
margin-bottom:12px;
}

.term-card p{
margin-bottom:10px;
}

.tag{
display:inline-block;
background:#e0f2f1;
color:#0f766e;
padding:5px 12px;
border-radius:20px;
font-size:13px;
font-weight:bold;
margin-top:8px;
margin-left:5px;
}

.speak-btn{
background:#0f766e;
color:white;
border:none;
padding:8px 14px;
border-radius:10px;
cursor:pointer;
margin:8px;
}

.ai-button{
position:fixed;
bottom:30px;
left:30px;
width:75px;
height:75px;
border:none;
border-radius:50%;
background:#0f766e;
color:white;
font-size:28px;
font-weight:bold;
cursor:pointer;
z-index:999;
}

.chat-box{
position:fixed;
bottom:120px;
left:30px;
width:390px;
height:530px;
background:white;
border-radius:22px;
display:none;
flex-direction:column;
overflow:hidden;
box-shadow:0 15px 40px rgba(0,0,0,.18);
z-index:999;
}

.chat-header{
background:#0f172a;
color:white;
padding:16px;
text-align:center;
font-weight:bold;
border-bottom:4px solid #c9a227;
position:relative;
}

.chat-close{
position:absolute;
left:15px;
top:50%;
transform:translateY(-50%);
background:none;
border:none;
color:white;
font-size:30px;
font-weight:bold;
cursor:pointer;
}

.chat-messages{
flex:1;
padding:15px;
overflow-y:auto;
}

.message{
padding:12px;
margin:10px 0;
border-radius:12px;
white-space:pre-wrap;
}

.bot{
background:#f3f4f6;
color:#111827;
}

.user{
background:#0f766e;
color:white;
}

.quick-buttons,
.chat-input{
display:flex;
gap:8px;
padding:10px;
background:#f8fafc;
}

.quick-buttons button{
flex:1;
background:#e2e8f0;
border:none;
border-radius:10px;
padding:10px;
cursor:pointer;
}

.chat-input input{
flex:1;
padding:12px;
border:1px solid #ccc;
border-radius:10px;
}

.chat-input button{
padding:12px 18px;
background:#0f766e;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="toolbar">
<button onclick="downloadPDF()">PDF</button>
<button onclick="toggleTheme()">☀ / 🌙</button>
<button onclick="changeFont(-1)">-A</button>
<button onclick="changeFont(1)">+A</button>
</div>

<header>
<h1>المصطلحات</h1>
<p>أهم مصطلحات الأمن السيبراني بطريقة مبسطة</p>
</header>

<nav>
<a href="index.html">الرئيسية</a>
<a href="terms.html">المصطلحات</a>
<a href="about.html">عن المشروع</a>
</nav>

<div class="container">

<div class="search-box">
<input id="searchInput" placeholder="ابحث عن مصطلح">
<button onclick="searchTerms()">بحث</button>
</div>

<div id="termsContainer" class="terms-grid">
<p>جاري تحميل المصطلحات...</p>
</div>

</div>

<button class="ai-button" onclick="toggleChat()">AI</button>

<div class="chat-box" id="chatBox">

<div class="chat-header">
المساعد الذكي للأمن السيبراني
<button class="chat-close" onclick="toggleChat()">×</button>
</div>

<div id="chatMessages" class="chat-messages">
<div class="message bot">
مرحباً بك 👋
اسألني عن أي مصطلح
</div>
</div>

<div class="quick-buttons">
<button onclick="quickAsk('ما هو التصيد الاحتيالي؟')">التصيد</button>
<button onclick="quickAsk('ما هو Malware؟')">Malware</button>
</div>

<div class="chat-input">
<button onclick="sendMessage()">إرسال</button>
<input id="userInput" placeholder="اكتب سؤالك هنا...">
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey:"YOUR_API_KEY",
authDomain:"YOUR_AUTH_DOMAIN",
projectId:"YOUR_PROJECT_ID",
storageBucket:"YOUR_STORAGE_BUCKET",
messagingSenderId:"YOUR_SENDER_ID",
appId:"YOUR_APP_ID"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let allTerms=[];

function translateDifficulty(value){
if(!value) return "غير محدد";

const v=value.toLowerCase();

if(v.includes("beginner")) return "مبتدئين";
if(v.includes("intermediate")) return "متوسط";
if(v.includes("advanced")) return "متقدم";

return value;
}

function translateCategory(value){
if(!value) return "عام";

const categories={
"social engineering":"الهندسة الاجتماعية",
"malware":"البرمجيات الخبيثة",
"network security":"أمن الشبكات",
"application security":"أمن التطبيقات",
"data security":"أمن البيانات",
"authentication":"المصادقة",
"password security":"أمن كلمات المرور"
};

return categories[value.toLowerCase()] || value;
}

async function loadTerms(){
const querySnapshot=await getDocs(collection(db,"terms"));

querySnapshot.forEach((doc)=>{
const data=doc.data();

allTerms.push({
english_term:data.english_term || "",
arabic_term:data.arabic_term || "",
definition_ar:data.definition_ar || "",
example_ar:data.example_ar || "",
solution_ar:data.solution_ar || "",
category:translateCategory(data.category || ""),
difficulty_level:translateDifficulty(data.difficulty_level || "")
});
});

displayTerms(allTerms);
}

function displayTerms(terms){
const container=document.getElementById("termsContainer");
container.innerHTML="";

terms.forEach(term=>{
container.innerHTML += `
<div class="term-card">

<h2>${term.english_term}</h2>

<h3>${term.arabic_term}</h3>

<div>
<button class="speak-btn" onclick="speakText('${term.english_term}','en-US')">
🔊 English
</button>

<button class="speak-btn" onclick="speakText('${term.arabic_term}','ar-SA')">
🔊 عربي
</button>
</div>

<p><strong>التعريف:</strong> ${term.definition_ar}</p>
<p><strong>مثال:</strong> ${term.example_ar}</p>
<p><strong>طريقة الحماية:</strong> ${term.solution_ar}</p>

<span class="tag">نوع المصطلح: ${term.category}</span>
<span class="tag">المستوى: ${term.difficulty_level}</span>

</div>
`;
});
}

window.searchTerms=function(){
const text=document.getElementById("searchInput").value.toLowerCase();

const filtered=allTerms.filter(term =>
term.english_term.toLowerCase().includes(text) ||
term.arabic_term.includes(text)
);

displayTerms(filtered);
}

loadTerms();
</script>

<script>
const WEBHOOK_URL="https://buth.app.n8n.cloud/webhook/ask-ai";

let fontSize=16;

function speakText(text,lang){
window.speechSynthesis.cancel();

const speech=new SpeechSynthesisUtterance();
speech.text=text;
speech.lang=lang;
speech.rate=0.9;
speech.pitch=1;
speech.volume=1;

window.speechSynthesis.speak(speech);
}

function toggleChat(){
const box=document.getElementById("chatBox");
box.style.display=box.style.display==="flex"?"none":"flex";
}

function addMessage(text,type){
const chat=document.getElementById("chatMessages");

const msg=document.createElement("div");
msg.className="message "+type;
msg.innerText=text;

chat.appendChild(msg);
chat.scrollTop=chat.scrollHeight;
}

function quickAsk(q){
document.getElementById("userInput").value=q;
sendMessage();
}

async function sendMessage(){
const input=document.getElementById("userInput");
const q=input.value.trim();

if(!q) return;

addMessage(q,"user");
input.value="";
addMessage("جاري التفكير...","bot");

try{
const res=await fetch(WEBHOOK_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({question:q})
});

const answer=await res.text();

document.getElementById("chatMessages").lastChild.remove();
addMessage(answer || "لم يصل رد.","bot");

}catch(e){
document.getElementById("chatMessages").lastChild.remove();
addMessage("حدث خطأ.","bot");
}
}

function toggleTheme(){
document.body.classList.toggle("dark");
}

function changeFont(v){
fontSize+=v;

if(fontSize<14) fontSize=14;
if(fontSize>26) fontSize=26;

document.body.style.fontSize=fontSize+"px";
}

function downloadPDF(){
window.print();
}

document.getElementById("userInput").addEventListener("keydown",function(e){
if(e.key==="Enter"){
sendMessage();
}
});
</script>

</body>
</html>
