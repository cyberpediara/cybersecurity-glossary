<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المصطلحات</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}
body{background:#f4f8fb;color:#0b1f33;line-height:2}
body.dark{background:#0b1f33;color:white}
body.dark .main-nav,body.dark .term-card,body.dark .chat-box{background:#102a43;color:white}
body.dark .main-nav a,body.dark .term-card p{color:white}
body.dark .search-box input,body.dark .chat-input input{background:#1e3a5f;color:white;border-color:#334155}
body.dark footer{background:#06111f}

.toolbar{position:fixed;top:20px;left:20px;display:flex;gap:10px;z-index:1000}
.toolbar button{background:white;border:none;padding:10px 15px;border-radius:10px;cursor:pointer;font-weight:bold;box-shadow:0 4px 10px rgba(0,0,0,.1)}

.hero{
background:linear-gradient(rgba(3,25,48,.9),rgba(3,25,48,.9)),url("https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=1600&q=80");
background-size:cover;background-position:center;color:white;text-align:center;padding:110px 20px;border-bottom:5px solid #c9a227
}
.hero h1{font-size:50px;margin-bottom:15px}
.hero p{font-size:22px}

.main-nav{
background:white;
display:flex;
justify-content:center;
gap:90px;
padding:22px;
box-shadow:0 5px 18px rgba(0,0,0,.08)
}

.main-nav a{
text-decoration:none;
color:#0b1f33;
font-size:20px;
font-weight:bold
}

.main-nav a:hover{color:#0f766e}

.container{
width:85%;
max-width:1200px;
margin:50px auto
}

.search-box{
display:flex;
gap:15px;
margin-bottom:30px
}

.search-box input{
flex:1;
padding:18px;
border:1px solid #cbd5e1;
border-radius:14px;
font-size:18px
}

.search-box button{
background:#0f766e;
color:white;
border:none;
padding:18px 30px;
border-radius:14px;
cursor:pointer;
font-size:18px;
font-weight:bold
}

.terms-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
gap:25px
}

.term-card{
background:white;
border-radius:20px;
padding:30px;
box-shadow:0 10px 28px rgba(0,0,0,.08);
border-right:7px solid #0f766e
}

.term-card h2{
color:#0f766e;
font-size:28px;
margin-bottom:10px
}

.term-card h3{
color:#c9a227;
font-size:22px;
margin-bottom:15px
}

.term-card p{
font-size:17px;
margin-bottom:10px
}

.tag{
display:inline-block;
background:#e0f2f1;
color:#0f766e;
padding:6px 14px;
border-radius:20px;
font-size:14px;
font-weight:bold;
margin-top:8px;
margin-left:5px
}

.speak-btn{
background:#0f766e;
color:white;
border:none;
padding:6px 10px;
border-radius:10px;
cursor:pointer;
font-size:13px;
margin-right:5px
}

.ai-button{
position:fixed;
bottom:40px;
left:40px;
width:85px;
height:85px;
border:none;
border-radius:50%;
background:#0f766e;
color:white;
font-size:28px;
font-weight:bold;
cursor:pointer;
z-index:999
}

.chat-box{
position:fixed;
bottom:140px;
left:40px;
width:390px;
height:530px;
background:white;
border-radius:20px;
display:none;
flex-direction:column;
overflow:hidden;
box-shadow:0 20px 45px rgba(0,0,0,.18);
z-index:999
}

.chat-header{
background:#0b1f33;
color:white;
padding:18px;
text-align:center;
font-weight:bold;
position:relative
}

.chat-close{
position:absolute;
left:15px;
top:50%;
transform:translateY(-50%);
background:none;
border:none;
color:white;
font-size:30px;
cursor:pointer
}

.chat-messages{
flex:1;
padding:15px;
overflow-y:auto
}

.message{
padding:12px;
margin:10px 0;
border-radius:12px
}

.bot{
background:#f1f5f9;
color:#0b1f33
}

.user{
background:#0f766e;
color:white
}

.chat-input{
display:flex;
padding:10px;
gap:10px
}

.chat-input input{
flex:1;
padding:12px;
border:1px solid #ccc;
border-radius:10px
}

.chat-input button{
padding:12px;
border:none;
background:#0f766e;
color:white;
border-radius:10px;
cursor:pointer
}

footer{
background:#061b33;
color:white;
text-align:center;
padding:25px;
margin-top:60px
}
</style>
</head>

<body>

<div class="toolbar">
<button onclick="changeFontSize(1)">A+</button>
<button onclick="changeFontSize(-1)">A-</button>
<button onclick="toggleTheme()">☀ / 🌙</button>
<button onclick="downloadPDF()">PDF</button>
</div>

<header class="hero">
<h1>المصطلحات</h1>
<p>استعرض أهم مصطلحات الأمن السيبراني بطريقة مبسطة</p>
</header>

<nav class="main-nav">
<a href="index.html">الرئيسية</a>
<a href="terms.html">المصطلحات</a>
<a href="about.html">عن المشروع</a>
</nav>

<div class="container">

<div class="search-box">
<input id="searchInput" placeholder="ابحث عن مصطلح">
<button onclick="searchTerms()">بحث</button>
</div>

<div id="termsContainer" class="terms-grid">
<p>جاري تحميل المصطلحات...</p>
</div>

</div>

<button class="ai-button" onclick="toggleChat()">AI</button>

<div class="chat-box" id="chatBox">
<div class="chat-header">
المساعد الذكي
<button class="chat-close" onclick="toggleChat()">×</button>
</div>

<div id="chatMessages" class="chat-messages">
<div class="message bot">مرحباً بك 👋
اسألني عن أي مصطلح.</div>
</div>

<div class="chat-input">
<button onclick="sendMessage()">إرسال</button>
<input id="userInput" placeholder="اكتب سؤالك هنا...">
</div>
</div>

<footer>
<p>مشروع تخرج - قاموس الأمن السيبراني 🛡️</p>
<p>جميع الحقوق محفوظة © 2024</p>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCeZRXwkgrd1ogjyV4f_ocwHPFp4TRSkd4",
authDomain: "cyberglossary-71e7d.firebaseapp.com",
projectId: "cyberglossary-71e7d",
storageBucket: "cyberglossary-71e7d.firebasestorage.app",
messagingSenderId: "1033056123958",
appId: "1:1033056123958:web:c5fa53180442ce770aac97"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allTerms=[];

function speakText(text,lang="ar-SA"){
if(!text)return;
window.speechSynthesis.cancel();
const speech=new SpeechSynthesisUtterance(text);
speech.lang=lang;
speech.rate=0.9;
speech.pitch=1;
window.speechSynthesis.speak(speech);
}
window.speakText=speakText;

/* ترجمة المستوى */
function translateDifficulty(value){
if(!value) return "مبتدئين";

const level=value.toString().toLowerCase().trim();

if(level==="beginner" || level==="beginners") return "مبتدئين";
if(level==="intermediate" || level==="medium") return "متوسط";
if(level==="advanced" || level==="hard") return "متقدم";

return "مبتدئين";
}

/* ترجمة نوع المصطلح */
function translateCategory(value){
if(!value) return "عام";

const key=value.toString().toLowerCase().trim();

const categories={
"social engineering":"الهندسة الاجتماعية",
"malware":"البرمجيات الخبيثة",
"network security":"أمن الشبكات",
"application security":"أمن التطبيقات",
"data security":"أمن البيانات",
"authentication":"المصادقة",
"password security":"أمن كلمات المرور",
"email security":"أمن البريد الإلكتروني",
"cloud security":"أمن الحوسبة السحابية",
"web security":"أمن الويب",
"privacy":"الخصوصية",
"cryptography":"التشفير",
"cyber attack":"هجمات سيبرانية",
"cyber attacks":"هجمات سيبرانية",
"threat":"تهديدات",
"threats":"تهديدات",
"attack":"هجمات",
"attacks":"هجمات",
"security concept":"مفهوم أمني",
"security concepts":"مفاهيم أمنية",
"protection":"الحماية",
"risk":"المخاطر",
"risks":"المخاطر",
"vulnerability":"الثغرات",
"vulnerabilities":"الثغرات",
"general":"عام"
};

return categories[key] || "عام";
}

async function loadTerms(){
try{
const querySnapshot=await getDocs(collection(db,"terms"));
allTerms=[];

querySnapshot.forEach((doc)=>{
const data=doc.data();

allTerms.push({
english_term:data.english_term || "",
arabic_term:data.arabic_term || "",
definition_ar:data.definition_ar || "",
example_ar:data.example_ar || "",
solution_ar:data.solution_ar || "",
category:translateCategory(data.category),
difficulty_level:translateDifficulty(data.difficulty_level)
});
});

displayTerms(allTerms);

}catch(error){
console.error(error);
document.getElementById("termsContainer").innerHTML="<p>فشل تحميل المصطلحات</p>";
}
}

function displayTerms(terms){
const container=document.getElementById("termsContainer");
container.innerHTML="";

if(terms.length===0){
container.innerHTML="<p>لا توجد نتائج.</p>";
return;
}

terms.forEach(term=>{
container.innerHTML+=`
<div class="term-card">
<h2>
${term.english_term}
<button class="speak-btn" onclick="speakText('${term.english_term}','en-US')">🔊</button>
</h2>

<h3>
${term.arabic_term}
<button class="speak-btn" onclick="speakText('${term.arabic_term}','ar-SA')">🔊</button>
</h3>

<p><strong>التعريف:</strong> ${term.definition_ar || "غير متوفر"}</p>
<p><strong>مثال:</strong> ${term.example_ar || "غير متوفر"}</p>
<p><strong>طريقة الحماية:</strong> ${term.solution_ar || "غير متوفر"}</p>

<span class="tag">نوع المصطلح: ${term.category}</span>
<span class="tag">المستوى: ${term.difficulty_level}</span>
</div>
`;
});
}

window.searchTerms=function(){
const text=document.getElementById("searchInput").value.toLowerCase().trim();

const filtered=allTerms.filter(term =>
term.english_term.toLowerCase().includes(text) ||
term.arabic_term.includes(text)
);

displayTerms(filtered);
}

loadTerms();
</script>

<script>
const WEBHOOK_URL="https://buth.app.n8n.cloud/webhook/ask-ai";
let fontSize=16;

function toggleTheme(){
document.body.classList.toggle("dark");
}

function toggleChat(){
const box=document.getElementById("chatBox");
box.style.display=box.style.display==="flex"?"none":"flex";
}

function addMessage(text,type){
const chat=document.getElementById("chatMessages");
const msg=document.createElement("div");
msg.className="message "+type;
msg.innerText=text;
chat.appendChild(msg);
chat.scrollTop=chat.scrollHeight;
}

async function sendMessage(){
const input=document.getElementById("userInput");
const q=input.value.trim();

if(!q)return;

addMessage(q,"user");
input.value="";
addMessage("جاري التفكير...","bot");

try{
const res=await fetch(WEBHOOK_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({question:q})
});

const answer=await res.text();
document.getElementById("chatMessages").lastChild.remove();
addMessage(answer || "لم يصل رد من المساعد.","bot");

}catch(error){
document.getElementById("chatMessages").lastChild.remove();
addMessage("حدث خطأ في الاتصال بالمساعد","bot");
}
}

function changeFontSize(v){
fontSize+=v;
if(fontSize<13)fontSize=13;
if(fontSize>26)fontSize=26;
document.body.style.fontSize=fontSize+"px";
}

function downloadPDF(){
window.print();
}

document.getElementById("userInput").addEventListener("keydown",function(e){
if(e.key==="Enter")sendMessage();
});
</script>

</body>
</html>
