<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المصطلحات</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif
}

body{
background:#f4f8fb;
color:#0b1f33;
line-height:2
}

/* الهيدر */
header{
background:
linear-gradient(rgba(4,28,54,.88),rgba(4,28,54,.88)),
url("https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=1600&q=80");
background-size:cover;
background-position:center;
color:white;
text-align:center;
padding:120px 20px 95px;
border-bottom:6px solid #c9a227
}

header h1{
font-size:56px;
font-weight:bold;
margin-bottom:10px
}

header p{
font-size:24px;
color:#f1f5f9
}

/* القائمة */
nav{
background:white;
padding:22px;
text-align:center;
border-bottom:1px solid #dbe3ea;
box-shadow:0 6px 18px rgba(15,23,42,.08)
}

nav a{
color:#0b1f33;
text-decoration:none;
margin:0 40px;
font-weight:bold;
font-size:20px
}

/* المحتوى */
.container{
width:82%;
max-width:1250px;
margin:55px auto
}

/* البحث */
.search-box{
display:flex;
gap:18px;
margin-bottom:35px
}

.search-box input{
flex:1;
padding:18px;
border:1px solid #cbd5e1;
border-radius:14px;
font-size:20px;
text-align:right
}

.search-box button{
background:#0f766e;
color:white;
border:none;
padding:18px 35px;
border-radius:14px;
cursor:pointer;
font-size:18px;
font-weight:bold
}

/* شبكة المصطلحات */
.terms-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
gap:25px
}

/* الكروت */
.term-card{
background:white;
padding:30px;
border-radius:22px;
box-shadow:0 18px 40px rgba(15,23,42,.12);
border:1px solid #e5e7eb;
position:relative;
overflow:hidden
}

.term-card::before{
content:"";
position:absolute;
top:0;
right:0;
width:100%;
height:6px;
background:linear-gradient(90deg,#c9a227,#0f766e)
}

.term-card h2{
color:#0f766e;
font-size:28px;
margin-bottom:10px
}

.term-card h3{
color:#c9a227;
font-size:23px;
margin-bottom:15px
}

.term-card p{
margin-bottom:10px;
font-size:18px
}

/* الوسوم */
.tag{
display:inline-block;
background:#e0f2f1;
color:#0f766e;
padding:6px 14px;
border-radius:20px;
font-size:14px;
font-weight:bold;
margin-top:8px;
margin-left:5px
}

/* زر الصوت */
.speak-btn{
background:#0f766e;
color:white;
border:none;
padding:6px 12px;
border-radius:10px;
cursor:pointer;
font-size:13px;
margin-right:6px
}

/* زر AI */
.ai-button{
position:fixed;
bottom:55px;
left:45px;
width:95px;
height:95px;
border:none;
border-radius:50%;
background:#0f766e;
color:white;
font-size:28px;
font-weight:bold;
cursor:pointer;
z-index:999;
box-shadow:0 15px 30px rgba(15,23,42,.25)
}

/* نافذة AI */
.chat-box{
position:fixed;
bottom:160px;
left:45px;
width:390px;
height:530px;
background:white;
border-radius:22px;
display:none;
flex-direction:column;
overflow:hidden;
box-shadow:0 20px 45px rgba(15,23,42,.18);
z-index:999
}

.chat-header{
background:#0b1f33;
color:white;
padding:18px;
text-align:center;
font-weight:bold;
border-bottom:4px solid #c9a227;
position:relative
}

.chat-close{
position:absolute;
left:15px;
top:50%;
transform:translateY(-50%);
background:none;
border:none;
color:white;
font-size:30px;
cursor:pointer
}

.chat-messages{
flex:1;
padding:15px;
overflow-y:auto
}

.message{
padding:12px;
margin:10px 0;
border-radius:14px
}

.bot{
background:#f1f5f9
}

.user{
background:#0f766e;
color:white
}

.chat-input{
display:flex;
padding:10px;
gap:10px;
background:#f8fafc
}

.chat-input input{
flex:1;
padding:12px;
border:1px solid #ccc;
border-radius:10px
}

.chat-input button{
padding:12px 18px;
background:#0f766e;
color:white;
border:none;
border-radius:10px;
cursor:pointer
}

@media(max-width:700px){
header h1{font-size:36px}
header p{font-size:18px}
nav a{display:inline-block;margin:8px 15px}
.container{width:92%}
.search-box{flex-direction:column}
.search-box button,.search-box input{width:100%}
.chat-box{width:90%;left:5%}
}
</style>
</head>

<body>

<header>
<h1>المصطلحات</h1>
<p>أهم مصطلحات الأمن السيبراني بطريقة مبسطة</p>
</header>

<nav>
<a href="index.html">الرئيسية</a>
<a href="terms.html">المصطلحات</a>
<a href="about.html">عن المشروع</a>
</nav>

<div class="container">

<div class="search-box">
<input id="searchInput" placeholder="ابحث عن مصطلح">
<button onclick="searchTerms()">بحث</button>
</div>

<div id="termsContainer" class="terms-grid">
<p>جاري تحميل المصطلحات...</p>
</div>

</div>

<button class="ai-button" onclick="toggleChat()">AI</button>

<div class="chat-box" id="chatBox">

<div class="chat-header">
المساعد الذكي للأمن السيبراني
<button class="chat-close" onclick="toggleChat()">×</button>
</div>

<div id="chatMessages" class="chat-messages">
<div class="message bot">
مرحباً بك 👋
اسألني عن أي مصطلح.
</div>
</div>

<div class="chat-input">
<button onclick="sendMessage()">إرسال</button>
<input id="userInput" placeholder="اكتب سؤالك هنا...">
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCeZRXwkgrd1ogjyV4f_ocwHPFp4TRSkd4",
authDomain: "cyberglossary-71e7d.firebaseapp.com",
projectId: "cyberglossary-71e7d",
storageBucket: "cyberglossary-71e7d.firebasestorage.app",
messagingSenderId: "1033056123958",
appId: "1:1033056123958:web:c5fa53180442ce770aac97"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allTerms=[];

function speakText(text,lang="ar-SA"){
if(!text)return;
window.speechSynthesis.cancel();
const speech=new SpeechSynthesisUtterance(text);
speech.lang=lang;
speech.rate=0.9;
speech.pitch=1;
window.speechSynthesis.speak(speech);
}

window.speakText=speakText;

async function loadTerms(){
const container=document.getElementById("termsContainer");

try{
const querySnapshot=await getDocs(collection(db,"terms"));
allTerms=[];

querySnapshot.forEach((doc)=>{
const data=doc.data();

allTerms.push({
english_term:data.english_term || "",
arabic_term:data.arabic_term || "",
definition_ar:data.definition_ar || "",
example_ar:data.example_ar || "",
solution_ar:data.solution_ar || "",
category:data.category || "عام",
difficulty_level:data.difficulty_level || "مبتدئين"
});
});

displayTerms(allTerms);

}catch(error){
console.error(error);
container.innerHTML="<p>فشل تحميل المصطلحات</p>";
}
}

function displayTerms(terms){
const container=document.getElementById("termsContainer");
container.innerHTML="";

if(terms.length===0){
container.innerHTML="<p>لا توجد نتائج.</p>";
return;
}

terms.forEach(term=>{
container.innerHTML+=`
<div class="term-card">

<h2>
${term.english_term}
<button class="speak-btn" onclick="speakText('${term.english_term}','en-US')">🔊</button>
</h2>

<h3>
${term.arabic_term}
<button class="speak-btn" onclick="speakText('${term.arabic_term}','ar-SA')">🔊</button>
</h3>

<p><strong>التعريف:</strong> ${term.definition_ar}</p>
<p><strong>مثال:</strong> ${term.example_ar}</p>
<p><strong>طريقة الحماية:</strong> ${term.solution_ar}</p>

<span class="tag">نوع المصطلح: ${term.category}</span>
<span class="tag">المستوى: ${term.difficulty_level}</span>

</div>
`;
});
}

window.searchTerms=function(){
const text=document.getElementById("searchInput").value.toLowerCase().trim();

const filtered=allTerms.filter(term=>
term.english_term.toLowerCase().includes(text) ||
term.arabic_term.includes(text)
);

displayTerms(filtered);
}

loadTerms();
</script>

<script>
const WEBHOOK_URL="https://buth.app.n8n.cloud/webhook/ask-ai";

function toggleChat(){
const box=document.getElementById("chatBox");
box.style.display=box.style.display==="flex"?"none":"flex";
}

function addMessage(text,type){
const chat=document.getElementById("chatMessages");
const msg=document.createElement("div");
msg.className="message "+type;
msg.innerText=text;
chat.appendChild(msg);
chat.scrollTop=chat.scrollHeight;
}

async function sendMessage(){
const input=document.getElementById("userInput");
const q=input.value.trim();

if(!q)return;

addMessage(q,"user");
input.value="";

try{
const res=await fetch(WEBHOOK_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({question:q})
});

const answer=await res.text();
addMessage(answer,"bot");

}catch(error){
addMessage("حدث خطأ في الاتصال بالمساعد","bot");
}
}
</script>

</body>
</html>
